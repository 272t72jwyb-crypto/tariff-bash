# Exemple HTTP pour un nouveau site. Pour un domaine existant, adapte son bloc
# server actuel et conserve ses directives TLS au lieu de le remplacer.
server {
    listen 80;
    listen [::]:80;
    server_name tariffbash.com www.tariffbash.com;

    root /srv/tariff-bash/dist;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}
